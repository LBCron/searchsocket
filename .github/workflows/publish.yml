name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed by the "tag is on main" ancestry check below.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify the tag matches package.json
        # An npm version is permanent, so publishing v0.8.0 from a tree that
        # still says 0.7.9 cannot be undone — only superseded. Check before any
        # build work runs.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not valid semver"
            exit 1
          fi

          # The tag and package.json agree by this point, so either is the same
          # source of truth for the dist-tag. A prerelease (1.0.0-rc.1) must not
          # land on "latest", where it would silently replace the stable release
          # for every plain `npm install searchsocket`.
          case "$TAG" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "publishing $PKG to dist-tag $DIST_TAG"

      - name: Verify the tag is on main
        # Guards against publishing from a branch that never went through the
        # release merge.
        run: |
          git fetch --depth=1 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit is not reachable from main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test

      - name: Verify the tarball is complete
        run: pnpm run check:package

      - run: pnpm publish --no-git-checks --access public --provenance --tag "${DIST_TAG:?dist-tag was not computed}"

      - name: Smoke test the published package
        # Confirms the registry actually serves what we just pushed, rather
        # than assuming a successful publish means a working install.
        run: |
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          # The install is retried for the same reason the dist-tag check below
          # is: the registry converges a little behind the publish. A fixed
          # sleep that turned out to be too short failed the workflow for a
          # version that had already published — and a published version is
          # immutable, so that failure could not be retried away.
          VERSION="${GITHUB_REF_NAME#v}"
          INSTALLED=""
          for _ in 1 2 3 4 5; do
            npm install "searchsocket@$VERSION" && { INSTALLED=yes; break; }
            sleep 10
          done
          if [ -z "$INSTALLED" ]; then
            echo "::error::searchsocket@$VERSION did not become installable"
            exit 1
          fi
          # A publish that landed on the wrong dist-tag installs and imports
          # perfectly well, so the smoke test has to look at the tag itself.
          # Retried because registry metadata converges a little behind the
          # publish; the only false failure left is a second release taking the
          # same dist-tag while this job runs.
          RESOLVED=""
          for _ in 1 2 3 4 5; do
            RESOLVED="$(npm view "searchsocket@$DIST_TAG" version || true)"
            [ "$RESOLVED" = "$VERSION" ] && break
            sleep 10
          done
          if [ "$RESOLVED" != "$VERSION" ]; then
            echo "::error::dist-tag $DIST_TAG resolves to ${RESOLVED:-nothing}, not $VERSION"
            exit 1
          fi
          node -e "import('searchsocket').then(m => { if (!m) process.exit(1); console.log('root import ok'); })"
          node -e "import('searchsocket/client').then(() => console.log('client import ok'))"
          node ./node_modules/searchsocket/dist/cli.js --version
